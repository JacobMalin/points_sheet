name: build-windows

on:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  get-and-bump-version:
    name: Get and Bump Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Bump version if same as latest release
        id: get-version
        run: |
          CURRENT_VERSION=$(yq '.version' pubspec.yaml)
          echo "Current pubspec version: $CURRENT_VERSION"

          # Get latest release tag from GitHub API (strip a leading 'v' if present).
          LATEST_TAG=$(curl -s "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases" | jq -r '[.[].tag_name][0] // empty')
          LATEST_TAG=${LATEST_TAG#v}
          echo "Latest release tag: ${LATEST_TAG:-<none>}"

          if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "$CURRENT_VERSION" ]; then
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
            NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
            yq -i ".version = \"$NEW_VERSION\"" pubspec.yaml
            echo "Bumped version from $CURRENT_VERSION to $NEW_VERSION"
            echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git pull
            git add pubspec.yaml
            git commit -m "chore: bump version to $NEW_VERSION [skip ci]" || echo "No changes to commit"
            git push
          else
            echo "Latest release ($LATEST_TAG) differs from current version ($CURRENT_VERSION); skipping bump."
            echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          fi

  ensure-release:
    name: Ensure Release Exists
    runs-on: ubuntu-latest
    needs: get-and-bump-version
    steps:
      - name: Ensure release exists for version tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_TAG: v${{ needs.get-and-bump-version.outputs.version }}
        run: |
          IS_PRERELEASE=false
          if [ "${GITHUB_REF_NAME}" = "prerelease" ]; then
            IS_PRERELEASE=true
          fi

          if gh release view "$VERSION_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ "$IS_PRERELEASE" = true ]; then
              gh release edit "$VERSION_TAG" -R "$GITHUB_REPOSITORY" --prerelease
            fi
          else
            if [ "$IS_PRERELEASE" = true ]; then
              gh release create "$VERSION_TAG" -R "$GITHUB_REPOSITORY" --title "$VERSION_TAG" --notes "Automated prerelease" --prerelease
            else
              gh release create "$VERSION_TAG" -R "$GITHUB_REPOSITORY" --title "$VERSION_TAG" --notes "Automated release"
            fi
          fi

  build-windows:
    name: 🪟 Windows Build
    runs-on: windows-latest
    needs: [get-and-bump-version, ensure-release]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Ensure up to date
        run: git pull

      - name: Cache Flutter pub packages
        uses: actions/cache@v6
        with:
          path: |
            ~\AppData\Local\Pub\Cache
          key: pub-cache-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            pub-cache-${{ runner.os }}-

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64

      - run: flutter pub get

      - run: flutter build windows --release

      - name: Create release archive
        run: |
          mkdir build\release
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath build\release\PointsSheet.zip
        shell: pwsh

      - name: Upload app to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload v${{ needs.get-and-bump-version.outputs.version }} build/release/PointsSheet.zip --clobber -R "$env:GITHUB_REPOSITORY"
